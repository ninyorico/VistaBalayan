<div style="font-family: system-ui, sans-serif, Arial; font-size: 12px; color: #0b2530">
  <div>{{name}}, your VistaBalayan verification code has been generated. Use this code to continue your request.</div>
  <div
    style="
      margin-top: 20px;
      padding: 15px 0;
      border-width: 1px 0;
      border-style: dashed;
      border-color: lightgrey;
    "
  >
    <table role="presentation">
      <tr>
        <td style="vertical-align: top">
          <div
            style="
              padding: 6px 10px;
              margin: 0 10px;
              background-color: aliceblue;
              border-radius: 5px;
              font-size: 26px;
            "
            role="img"
          >
            🔐
          </div>
        </td>
        <td style="vertical-align: top">
          <div style="color: #2c3e50; font-size: 16px">
            <strong>{{name}}</strong>
          </div>
          <div style="color: #cccccc; font-size: 13px">{{time}}</div>
          <p style="font-size: 16px; margin-bottom: 10px">{{message}}</p>
          <div
            style="
              display: inline-block;
              padding: 14px 18px;
              border-radius: 12px;
              background-color: #f1f5f9;
              color: #0e5a72;
              font-size: 32px;
              font-weight: 800;
              letter-spacing: 8px;
            "
          >
            {{otp_code}}
          </div>
          <p style="font-size: 13px; color: #64748b; margin-top: 14px">
            This code expires in {{expires_in}}. Do not share it with anyone.
          </p>
        </td>
      </tr>
    </table>
  </div>
</div>
